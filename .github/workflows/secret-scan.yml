name: secret-scan

# Scans the full git history for committed credentials, on every push and PR
# plus a weekly sweep.
#
# Two scanners, because they answer different questions:
#   gitleaks   — regex + entropy over the whole history. Broad recall, and it
#                reports on pattern alone, so a hit is a lead to triage.
#   trufflehog — runs with --only-verified, meaning it reports a credential
#                only after confirming with the provider that the key is still
#                live. Near-zero false positives; a hit here is an emergency,
#                not a lead. Rotate first, scrub second.
#
# Scope note: this workflow looks for SECRETS only. Disclosure — names and
# addresses that should not become public — is a separate concern, gated at the
# point of publication by a pre-push hook rather than here. That deny-list
# enumerates exactly what it protects, so it lives in a private repository and
# deliberately not in one that could ever be published.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC — offset from ci.yml's 14:00
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action v3 lists the PR's commits (GET /repos/../pulls/N/commits) to
  # scope its scan, so on a pull_request event it needs this or the job dies
  # with 403 "Resource not accessible by integration". v2 did not: setting
  # GITLEAKS_ENABLE_COMMENTS=false was enough to keep it off the PR APIs there,
  # and that workaround silently stopped covering this call at the v3 bump.
  # Read-only: it still cannot comment, which is what the flag below prevents.
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: a secret is usually in an old commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pointed at the repo's config explicitly rather than relying on
          # auto-discovery. That config allowlists documentation placeholders
          # and test fixtures by the shape of the secret, never by file path.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # No PR comments. On a pull_request event the action otherwise calls
          # the issues API to comment inline, which needs pull-requests:write —
          # and failing that call fails the whole job, so every PR-triggered run
          # went red while push-triggered runs passed. The job's own pass/fail
          # is the signal here; Dependabot PRs auto-merge and nobody reads a
          # comment on them. Keeps permissions at contents:read.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # GITLEAKS_LICENSE is only needed for organization accounts.
          # This repo is on a personal account, so no key is required.

      - name: trufflehog (verified credentials only)
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          path: ./
          # An empty base forces a whole-history scan rather than the
          # event's diff, which is what the weekly sweep is for.
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified
