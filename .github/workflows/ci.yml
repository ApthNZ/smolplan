name: ci

# Runs the repo's own test suite on every push and PR to the default branch,
# plus a weekly scheduled run. This is deliberately separate from
# dependabot-automerge.yml: that one only runs on Dependabot PRs, so a break
# introduced by a normal commit stays invisible until some unrelated dependency
# bump trips over it. With this workflow a break goes red at the commit that
# causes it instead.
#
# Mirrors the test invocation used by dependabot-automerge.yml and no-ops
# cleanly in repos that have no Python test suite.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"  # weekly, Monday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python this runs on, and the one the image ships. Behaviour
        # that differs between them — the Unicode tables text cleaning reads,
        # for one — would otherwise only ever be tested on the older.
        python-version: ["3.10", "3.14"]
    steps:
      # Actions are pinned to a commit, with the version as a comment for
      # Dependabot to move forward. A tag can be re-pointed; a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          for f in requirements-dev.txt requirements-test.txt test-requirements.txt dev-requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
          if [ -f run_tests.py ]; then
            python run_tests.py
          elif [ -d tests ]; then
            python -m pytest tests/ -q
          else
            echo "No test suite found — nothing to run."
          fi

  image:
    # The suite never builds the Dockerfile or reads the compose file, so a
    # base-image bump would otherwise pass on tests that did not run it. This
    # builds what the compose file runs, hardening included, and waits for the
    # container's own healthcheck to go green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image and wait for /health
        run: |
          # The compose file runs as uid 1000, which the runner is not.
          mkdir -p data && chmod 777 data
          if ! docker compose up -d --build --wait --wait-timeout 120; then
            docker compose logs
            exit 1
          fi
          docker compose down
