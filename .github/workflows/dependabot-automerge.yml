name: dependabot-automerge

# Tests every Dependabot PR and merges it if the tests pass — regardless of
# semver level (patch, minor, or major). The test suite IS the judgment: if an
# upgrade breaks something, tests fail and the merge does not happen. Nothing
# waits on human review. The suite runs on the oldest supported Python and on
# the image's, and the image is built and health-checked too, so a docker bump
# is judged by something that actually ran it.
#
# Uses pull_request_target so the GITHUB_TOKEN has merge rights even for
# Dependabot PRs. Only Dependabot-authored PRs are processed (see `if` below).
#
# This file is published to the public mirror, and since 2026-09-17 the mirror
# is a fast-forward of this history — so a merge there would put a commit on
# public/main that private/main does not have, and every later `git push public
# main` would be refused as a non-fast-forward. The repository guard below is
# what prevents that: bumps land here and reach the mirror by being pushed.
#
# It also means this workflow never runs on the public repo at all, which
# retires the old worry about `github.actor` being the only thing between a
# stranger's PR and a write-scoped token on a world-readable repo.
#
# Dependabot still opens its own PRs against the mirror. They are duplicates,
# they cannot be merged there, and Dependabot closes them by itself once the
# same bump arrives from here.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    # Three conditions. The PR's author, not just the actor: `github.actor` is
    # whoever triggered the latest event, which is not always who wrote the
    # PR. And the repository, which is the load-bearing one — see above.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && endsWith(github.repository, '-private')
    steps:
      # Pinned to commits: this job holds a write token, which is exactly where
      # a re-pointed tag would do the most damage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.14

      # Both the oldest supported Python and the one the image ships, as ci.yml.
      - name: Install dependencies and run tests
        run: |
          for version in 3.10 3.14; do
            python$version -m venv "/tmp/venv-$version"
            py="/tmp/venv-$version/bin/python"
            "$py" -m pip install --upgrade pip
            if [ -f requirements.txt ]; then "$py" -m pip install -r requirements.txt; fi
            for f in requirements-dev.txt requirements-test.txt test-requirements.txt dev-requirements.txt; do
              [ -f "$f" ] && "$py" -m pip install -r "$f"
            done
            if [ -f run_tests.py ]; then "$py" run_tests.py; else "$py" -m pytest tests/ -q; fi
          done

      # A docker bump changes nothing the tests run, so the image itself is
      # built and health-checked before anything merges.
      - name: Build the image and wait for /health
        run: |
          mkdir -p data && chmod 777 data
          if ! docker compose up -d --build --wait --wait-timeout 120; then
            docker compose logs
            exit 1
          fi
          docker compose down

      # Only runs if every step above succeeded. A failing upgrade never
      # reaches this step, so it stays open (visible on the status wall) until
      # the upstream incompatibility is resolved.
      - name: Merge (tests and image passed)
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
