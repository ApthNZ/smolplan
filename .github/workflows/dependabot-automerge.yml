name: dependabot-automerge

# Tests every Dependabot PR and merges it if the tests pass — regardless of
# semver level (patch, minor, or major). The test suite IS the judgment: if an
# upgrade breaks something, tests fail and the merge does not happen. Nothing
# waits on human review.
#
# Uses pull_request_target so the GITHUB_TOKEN has merge rights even for
# Dependabot PRs. Only Dependabot-authored PRs are processed (see `if` below).
#
# This file is published to the public mirror, and since 2026-09-17 the mirror
# is a fast-forward of this history — so a merge there would put a commit on
# public/main that private/main does not have, and every later `git push public
# main` would be refused as a non-fast-forward. The repository guard below is
# what prevents that: bumps land here and reach the mirror by being pushed.
#
# It also means this workflow never runs on the public repo at all, which
# retires the old worry about `github.actor` being the only thing between a
# stranger's PR and a write-scoped token on a world-readable repo.
#
# Dependabot still opens its own PRs against the mirror. They are duplicates,
# they cannot be merged there, and Dependabot closes them by itself once the
# same bump arrives from here.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && endsWith(github.repository, '-private')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          for f in requirements-dev.txt requirements-test.txt test-requirements.txt dev-requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
          pip install pytest pytest-asyncio
          if [ -f run_tests.py ]; then python run_tests.py; else python -m pytest tests/ -q; fi

      # Only runs if the test step above succeeded. A failing upgrade never
      # reaches this step, so it stays open (visible on the status wall) until
      # the upstream incompatibility is resolved.
      - name: Merge (tests passed)
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
