<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- smolplan: three ranked bars on a Monokai ground. Green fits, pink does
       not, and the third sits further out — the portfolio view in miniature.
       Bars are 6 units tall so they still read at 16px in a tab strip. -->
