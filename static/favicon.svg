  <rect x="5"  y="4"  width="17" height="6" rx="3" fill="#A6E22E"/>
  <rect x="9"  y="13" width="12" height="6" rx="3" fill="#F92672"/>
  <rect x="7"  y="22" width="20" height="6" rx="3" fill="#66D9EF"/>
</svg>
